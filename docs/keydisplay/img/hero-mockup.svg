<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="mockTitle mockDesc">
  <title id="mockTitle">KeyDisplayのオーバーレイ表示イメージ</title>
  <desc id="mockDesc">実機スクリーンショットではなく、キー入力・マウスカーソル・クリック表示のイメージを示したモックアップ図です。左下にCtrl+Shift+Sの結合キーキャップとその説明、右上にカーソルのリングハイライトとクリックの波紋、中央にドラッグ軌跡を示しています。</desc>

  <defs>
    <linearGradient id="mockBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12142090"/>
      <stop offset="1" stop-color="#0a0b1090"/>
    </linearGradient>
    <pattern id="mockGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#5a8cff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 透過オーバーレイであることを示す、下地のビューポート -->
  <rect x="0" y="0" width="720" height="480" rx="22" fill="url(#mockBg)"/>
  <rect x="0" y="0" width="720" height="480" rx="22" fill="url(#mockGrid)"/>
  <rect x="1" y="1" width="718" height="478" rx="21" fill="none" stroke="#86a9ff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- ドラッグ軌跡（折れ線） -->
  <path d="M300 120 C 380 160, 430 210, 470 260" fill="none" stroke="#86a9ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 12" opacity="0.85"/>
  <circle cx="300" cy="120" r="4" fill="#86a9ff"/>
  <circle cx="470" cy="260" r="4" fill="#86a9ff"/>

  <!-- マウスホイールの上下表示 -->
  <g transform="translate(560,150)" opacity="0.92">
    <path d="M0 -18 L10 -4 L4 -4 L4 8 L-4 8 L-4 -4 L-10 -4 Z" fill="#eef1fb"/>
  </g>

  <!-- クリック波紋（左クリック=赤、右クリック=青） -->
  <circle cx="560" cy="150" r="14" fill="none" stroke="#ff453a" stroke-width="2.5" opacity="0.85"/>
  <circle cx="560" cy="150" r="26" fill="none" stroke="#ff453a" stroke-width="1.5" opacity="0.4"/>
  <circle cx="470" cy="260" r="12" fill="none" stroke="#3aa5ff" stroke-width="2.5" opacity="0.8"/>
  <circle cx="470" cy="260" r="22" fill="none" stroke="#3aa5ff" stroke-width="1.5" opacity="0.35"/>

  <!-- マウスカーソルのリングハイライト -->
  <circle cx="620" cy="90" r="16" fill="none" stroke="#ffd60a" stroke-width="3"/>
  <circle cx="620" cy="90" r="3" fill="#ffd60a"/>

  <!-- フェードアウト中のキーキャップ（離した直後） -->
  <g opacity="0.35">
    <rect x="40" y="300" width="66" height="52" rx="12" fill="#1e1e1e" stroke="#3a3f52" stroke-width="1.5"/>
    <text x="73" y="333" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="20" font-weight="700" fill="#eef1fb">W</text>
  </g>

  <!-- 押下中の結合キーキャップ：Ctrl + Shift + S -->
  <g>
    <rect x="40" y="368" width="248" height="60" rx="14" fill="#1e1e1e" stroke="#5a8cff" stroke-width="2.5"/>
    <text x="164" y="405" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="21" font-weight="700" fill="#f4f6ff">Ctrl + Shift + S</text>
  </g>

  <!-- Unity/Blenderのショートカット説明ヒント -->
  <text x="40" y="452" font-family="system-ui, sans-serif" font-size="15" fill="#a7adc4">保存（Blender: 名前を付けて保存）</text>
</svg>
